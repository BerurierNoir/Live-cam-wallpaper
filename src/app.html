<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CamWall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');

:root {
  --bg:      #030508;
  --green:   #00e87a;
  --gdim:    #007a45;
  --gglow:   rgba(0,232,122,0.2);
  --red:     #ff3b55;
  --amber:   #ffaa00;
  --text:    #b8ccb8;
  --tdim:    #3a5040;
  --border:  rgba(0,200,100,0.12);
  --mono:    'Share Tech Mono', monospace;
  --sans:    'Rajdhani', system-ui, sans-serif;
  --hud:     56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; user-select: none; }

body::after {
  content: ''; position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
  pointer-events: none; z-index: 9998;
}

/* ─── GRILLE ─────────────────────────────────────────────── */
#grid {
  position: fixed; inset: 0;
  display: grid; gap: 3px; background: #000;
  transition: grid-template-columns 0.35s, grid-template-rows 0.35s;
}

/* ─── CELLULE ────────────────────────────────────────────── */
.cam-cell {
  position: relative; background: #000; overflow: hidden;
  cursor: pointer; outline: 1px solid rgba(0,200,100,0.05);
  transition: outline-color 0.2s;
}
.cam-cell:hover { outline-color: rgba(0,200,100,0.3); }

/* L'image MJPEG remplit toute la cellule */
.cam-cell img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}

/* coins hover */
.cam-cell::before, .cam-cell::after {
  content: ''; position: absolute; width: 14px; height: 14px;
  opacity: 0; transition: opacity 0.2s; z-index: 4; pointer-events: none;
}
.cam-cell::before { top: 7px; left: 7px; border-top: 1.5px solid var(--green); border-left: 1.5px solid var(--green); }
.cam-cell::after  { bottom: 7px; right: 7px; border-bottom: 1.5px solid var(--green); border-right: 1.5px solid var(--green); }
.cam-cell:hover::before, .cam-cell:hover::after { opacity: 1; }

/* vignette */
.cam-vignette {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 22%), linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 22%);
  opacity: 0; transition: opacity 0.2s; z-index: 2; pointer-events: none;
}
.cam-cell:hover .cam-vignette { opacity: 1; }

/* badge */
.cam-id {
  position: absolute; top: 8px; left: 10px;
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: 1.5px;
  color: var(--green); text-shadow: 0 0 8px var(--gglow); z-index: 5;
}

.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s; }
.dot.online     { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.offline    { background: var(--red);   box-shadow: 0 0 6px var(--red);   animation: blink 1.2s infinite; }
.dot.loading    { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: blink 0.5s infinite; }
.dot.paused     { background: var(--tdim);  box-shadow: none; }

/* REC */
.cam-rec {
  position: absolute; top: 8px; right: 10px;
  display: flex; align-items: center; gap: 4px;
  font-size: 9px; letter-spacing: 2px; color: var(--red);
  z-index: 5; opacity: 0; transition: opacity 0.2s;
}
.cam-rec::before { content: ''; width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: blink 1s infinite; }
.cam-cell:hover .cam-rec { opacity: 1; }

/* label */
.cam-label {
  position: absolute; bottom: 9px; left: 11px;
  font-family: var(--sans); font-weight: 700; font-size: 12px;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,0.85); text-shadow: 0 1px 5px rgba(0,0,0,0.95);
  z-index: 5; opacity: 0; transition: opacity 0.2s;
}
.cam-cell:hover .cam-label { opacity: 1; }

/* bouton pause individuel */
.cam-toggle {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.85);
  width: 42px; height: 42px; background: rgba(0,0,0,0.65);
  border: 1px solid var(--border); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; z-index: 6;
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
}
.cam-cell:hover .cam-toggle { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* offline overlay */
.cam-err {
  position: absolute; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; z-index: 7; background: rgba(3,5,8,0.8);
}
.cam-err.show { display: flex; }
.cam-err-icon { font-size: 28px; opacity: 0.3; }
.cam-err-msg  { font-size: 10px; color: var(--tdim); letter-spacing: 1px; }
.cam-err-retry {
  font-size: 9px; color: var(--gdim); letter-spacing: 1px;
  cursor: pointer; border: 1px solid var(--border); padding: 4px 10px;
  border-radius: 2px; transition: color 0.15s;
}
.cam-err-retry:hover { color: var(--green); }

/* cellule focus */
.cam-cell.focused { position: fixed; inset: 0; z-index: 50; outline: 2px solid var(--green); cursor: default; }

@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.15; } }

/* ─── HUD ────────────────────────────────────────────────── */
#hud-zone {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 72px; z-index: 100; pointer-events: all;
}

#hud {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: var(--hud);
  background: rgba(3,5,8,0.97);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}

#hud-zone:hover #hud,
#hud:hover { transform: translateY(0); }

.hs { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 100%; }
.hd { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
.sp { flex: 1; }

#hud-logo { font-family: var(--sans); font-weight: 700; font-size: 14px; letter-spacing: 3px; color: var(--green); text-shadow: 0 0 10px var(--gglow); }
#hud-clock { font-size: 18px; letter-spacing: 3px; font-variant-numeric: tabular-nums; min-width: 82px; }
#hud-date  { font-family: var(--sans); font-size: 10px; color: var(--tdim); letter-spacing: 1px; text-transform: uppercase; }
#cam-badge { font-size: 10px; letter-spacing: 1.5px; color: var(--gdim); border: 1px solid var(--border); padding: 3px 8px; border-radius: 2px; }

/* layout picker */
#lpicker { display: flex; gap: 3px; }
.lpick {
  width: 28px; height: 28px; display: grid; padding: 5px; gap: 2px;
  background: transparent; border: 1px solid rgba(0,200,100,0.1);
  border-radius: 3px; cursor: pointer; transition: all 0.15s;
}
.lpick span { background: rgba(0,200,100,0.35); border-radius: 1px; display: block; }
.lpick:hover  { border-color: rgba(0,200,100,0.3); background: rgba(0,200,100,0.04); }
.lpick.active { border-color: rgba(0,200,100,0.55); background: rgba(0,200,100,0.08); }
.lpick.auto   { align-items: center; justify-content: center; font-size: 8px; letter-spacing: 1px; color: rgba(0,200,100,0.5); padding: 0; }

/* boutons HUD */
.hbtn {
  height: 30px; padding: 0 12px;
  background: transparent; border: 1px solid rgba(0,200,100,0.12);
  border-radius: 3px; color: var(--text); font-family: var(--mono);
  font-size: 10px; letter-spacing: 1px; cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all 0.15s; white-space: nowrap;
}
.hbtn:hover  { background: rgba(0,200,100,0.06); border-color: rgba(0,200,100,0.35); color: var(--green); }
.hbtn.on     { background: rgba(255,170,0,0.08); border-color: rgba(255,170,0,0.3); color: var(--amber); }
.hbtn.quit   { border-color: rgba(255,59,85,0.15); }
.hbtn.quit:hover { background: rgba(255,59,85,0.08); border-color: rgba(255,59,85,0.4); color: var(--red); }

/* ─── PANNEAU CONFIG ─────────────────────────────────────── */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 330px;
  background: #0c1018; border-left: 1px solid var(--border);
  z-index: 200; transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
}
#panel.open { transform: translateX(0); }

#ph {
  height: 52px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; flex-shrink: 0;
  font-size: 10px; letter-spacing: 2px; color: var(--green); text-transform: uppercase;
}
#ph-close {
  width: 26px; height: 26px; border: 1px solid var(--border);
  border-radius: 2px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 12px; color: var(--tdim); transition: all 0.15s;
}
#ph-close:hover { border-color: var(--red); color: var(--red); }

#pb { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.pg { margin-bottom: 22px; }
.pt {
  font-size: 9px; letter-spacing: 2px; color: var(--gdim);
  text-transform: uppercase; padding-bottom: 7px;
  border-bottom: 1px solid var(--border); margin-bottom: 10px;
}

#camlist { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }

.ce {
  background: rgba(0,200,100,0.02); border: 1px solid var(--border);
  border-radius: 3px; padding: 9px; display: flex; flex-direction: column; gap: 5px;
}
.cer { display: flex; gap: 5px; align-items: center; }
.ce input {
  flex: 1; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07); border-radius: 2px;
  color: var(--text); font-family: var(--mono); font-size: 10px;
  padding: 5px 7px; outline: none; transition: border-color 0.15s;
}
.ce input:focus { border-color: var(--gdim); }
.ce input::placeholder { color: #1a3020; }
.ce-del {
  width: 24px; height: 24px; flex-shrink: 0;
  background: rgba(255,59,85,0.05); border: 1px solid rgba(255,59,85,0.15);
  border-radius: 2px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 11px; color: var(--red); transition: background 0.15s;
}
.ce-del:hover { background: rgba(255,59,85,0.18); }

#btn-addcam {
  width: 100%; padding: 8px; background: transparent;
  border: 1px dashed rgba(0,200,100,0.18); border-radius: 3px;
  color: var(--gdim); font-family: var(--mono); font-size: 10px;
  letter-spacing: 1.5px; cursor: pointer; text-align: center;
  transition: all 0.15s;
}
#btn-addcam:hover { border-color: var(--green); color: var(--green); }

.pr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 10px; gap: 10px;
}
.pr span { color: var(--tdim); }
.pr input[type=text], .pr input[type=number], .pr select {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 2px; color: var(--text); font-family: var(--mono);
  font-size: 10px; padding: 4px 7px; outline: none; max-width: 130px;
}

.tgl { position: relative; width: 36px; height: 18px; cursor: pointer; }
.tgl input { opacity: 0; width: 0; height: 0; }
.tgl-t {
  position: absolute; inset: 0; background: #0f1f14;
  border: 1px solid rgba(0,200,100,0.15); border-radius: 9px; transition: all 0.2s;
}
.tgl-t::before {
  content: ''; position: absolute;
  width: 12px; height: 12px; border-radius: 50%;
  background: #1a3020; top: 2px; left: 2px; transition: transform 0.2s, background 0.2s;
}
.tgl input:checked + .tgl-t { border-color: rgba(0,200,100,0.4); }
.tgl input:checked + .tgl-t::before { transform: translateX(18px); background: var(--green); }

/* sélecteur écrans */
#displayer { display: flex; flex-direction: column; gap: 6px; }
.dopt {
  padding: 9px 11px; background: rgba(0,200,100,0.02);
  border: 1px solid var(--border); border-radius: 3px;
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; transition: all 0.15s;
}
.dopt:hover  { border-color: rgba(0,200,100,0.3); }
.dopt.active { border-color: var(--green); color: var(--green); }
.dopt .dbadge { font-size: 9px; color: var(--tdim); }

#btn-save {
  width: 100%; padding: 10px; margin-top: 14px;
  background: rgba(0,200,100,0.08); border: 1px solid rgba(0,200,100,0.3);
  border-radius: 3px; color: var(--green); font-family: var(--mono);
  font-size: 11px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase;
  transition: all 0.15s;
}
#btn-save:hover { background: rgba(0,200,100,0.15); border-color: var(--green); }
#save-ok { text-align: center; font-size: 9px; color: var(--gdim); letter-spacing: 1px; height: 16px; margin-top: 8px; }

/* hint */
#hint {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 14px; background: rgba(3,5,8,0.75);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 6px 16px; font-size: 9px; color: var(--tdim); letter-spacing: 1px;
  z-index: 300; opacity: 0; transition: opacity 0.4s; pointer-events: none;
}
#hint.show { opacity: 1; }
#hint kbd { color: var(--gdim); margin-right: 3px; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="hud-zone">
  <div id="hud">
    <div class="hs">
      <span id="hud-logo">CamWall</span>
      <div class="hd"></div>
      <span id="hud-clock">00:00:00</span>
      <span id="hud-date"></span>
    </div>
    <div class="hd"></div>
    <div class="hs">
      <span id="cam-badge">— CAM</span>
      <div id="lpicker"></div>
    </div>
    <div class="sp"></div>
    <div class="hs">
      <button class="hbtn" id="btn-pause">⏸ PAUSE</button>
      <button class="hbtn" id="btn-cfg">⚙ CONFIG</button>
      <div class="hd"></div>
      <button class="hbtn quit" id="btn-quit">✕</button>
    </div>
  </div>
</div>

<div id="panel">
  <div id="ph">
    <span>// Paramètres</span>
    <div id="ph-close">✕</div>
  </div>
  <div id="pb">
    <div class="pg">
      <div class="pt">Caméras</div>
      <div id="camlist"></div>
      <div id="btn-addcam">+ AJOUTER UNE CAMÉRA</div>
    </div>
    <div class="pg">
      <div class="pt">Écran dédié</div>
      <div id="displayer"></div>
    </div>
    <div class="pg">
      <div class="pt">Connexion</div>
      <div class="pr"><span>go2rtc URL</span><input id="s-server" type="text" value="http://localhost:1984" style="width:145px"></div>
      <div class="pr"><span>Reconnexion auto</span><label class="tgl"><input type="checkbox" id="s-reconnect" checked><span class="tgl-t"></span></label></div>
      <div class="pr"><span>Délai (s)</span><input id="s-delay" type="number" value="5" min="2" max="60" style="width:55px"></div>
    </div>
    <div class="pg">
      <div class="pt">Affichage</div>
      <div class="pr"><span>Horloge</span><label class="tgl"><input type="checkbox" id="s-clock" checked><span class="tgl-t"></span></label></div>
      <div class="pr"><span>Labels caméras</span><label class="tgl"><input type="checkbox" id="s-labels" checked><span class="tgl-t"></span></label></div>
      <div class="pr"><span>Pause si inactif (min, 0=off)</span><input id="s-idle" type="number" value="0" min="0" max="120" style="width:55px"></div>
    </div>
    <button id="btn-save">SAUVEGARDER &amp; APPLIQUER</button>
    <div id="save-ok"></div>
    <div class="pg" style="margin-top:18px">
      <div class="pt">Utilitaires</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <button class="hbtn" id="btn-opendir">📂 Config</button>
        <button class="hbtn" id="btn-setup">🔧 Assistant</button>
      </div>
    </div>
  </div>
</div>

<div id="hint">
  <span><kbd>Clic</kbd>zoom</span>
  <span><kbd>ESC</kbd>retour</span>
  <span><kbd>P</kbd>pause</span>
  <span><kbd>S</kbd>settings</span>
  <span><kbd>F12</kbd>debug</span>
</div>

<script>
const API = window.CamWall;
let cfg = {}, camPaused = {}, globalPaused = false, focusedCam = null, layoutOvr = null;

// ── MJPEG URL ───────────────────────────────────────────────
function mjpegUrl(id) {
  const port = cfg.go2rtcPort || 1984;
  return `http://localhost:${port}/api/stream.mjpeg?src=${encodeURIComponent(id)}`;
}

// ── LAYOUTS ─────────────────────────────────────────────────
const LAYOUTS = [
  { id:'auto' },
  { id:'1',  cols:1, rows:1 },
  { id:'2',  cols:2, rows:1 },
  { id:'4',  cols:2, rows:2 },
  { id:'6',  cols:3, rows:2 },
  { id:'9',  cols:3, rows:3 },
];
function autoGrid(n) {
  if (n<=1) return [1,1]; if (n===2) return [2,1];
  if (n<=4) return [2,2]; if (n<=6) return [3,2]; return [3,3];
}
function applyLayout() {
  const grid = document.getElementById('grid');
  if (focusedCam) { grid.style.gridTemplateColumns='1fr'; grid.style.gridTemplateRows='1fr'; return; }
  const lid = layoutOvr || 'auto';
  const l   = LAYOUTS.find(x => x.id === lid);
  const [cols, rows] = (l && l.cols) ? [l.cols, l.rows] : autoGrid(cfg.cameras.length);
  grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  grid.style.gridTemplateRows    = `repeat(${rows},1fr)`;
  document.querySelectorAll('.lpick').forEach(b => b.classList.toggle('active', b.dataset.id === lid));
}
function buildLP() {
  const p = document.getElementById('lpicker'); p.innerHTML = '';
  LAYOUTS.forEach(l => {
    const btn = document.createElement('div');
    btn.className = 'lpick' + (l.id==='auto' ? ' auto' : '');
    btn.dataset.id = l.id;
    if (l.id === 'auto') { btn.textContent = 'AUTO'; }
    else {
      const c=Math.min(l.cols,3), r=Math.min(l.rows,3);
      btn.style.gridTemplateColumns=`repeat(${c},1fr)`;
      btn.style.gridTemplateRows=`repeat(${r},1fr)`;
      for(let i=0;i<c*r;i++) btn.appendChild(document.createElement('span'));
    }
    btn.addEventListener('click', () => { layoutOvr = l.id==='auto' ? null : l.id; applyLayout(); });
    p.appendChild(btn);
  });
}

// ── CLOCK ───────────────────────────────────────────────────
function startClock() {
  const pad = n => String(n).padStart(2,'0');
  setInterval(() => {
    const now = new Date();
    const cl = document.getElementById('hud-clock');
    const dt = document.getElementById('hud-date');
    if (cl) cl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    if (dt) dt.textContent = now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
  }, 1000);
}

// ── GRILLE MJPEG ────────────────────────────────────────────
function renderGrid() {
  const grid  = document.getElementById('grid');
  const names = cfg.cameras.map(c => c.id);

  // Supprimer les cellules disparues
  [...grid.querySelectorAll('.cam-cell')].forEach(cell => {
    if (!names.includes(cell.dataset.id)) cell.remove();
  });

  cfg.cameras.forEach((cam, idx) => {
    let cell = document.getElementById(`cell-${cam.id}`);
    if (!cell) {
      cell = document.createElement('div');
      cell.className  = 'cam-cell';
      cell.id         = `cell-${cam.id}`;
      cell.dataset.id = cam.id;

      const img = document.createElement('img');
      img.alt = cam.label || cam.id;

      // Gestion erreur / reconnexion
      let retryTimer = null;
      function loadImg() {
        setDot(cell, 'loading');
        const errDiv = cell.querySelector('.cam-err');
        if (errDiv) errDiv.classList.remove('show');
        // Timestamp pour forcer le rechargement
        img.src = mjpegUrl(cam.id) + `&_t=${Date.now()}`;
      }
      img.onload = () => setDot(cell, 'online');
      img.onerror = () => {
        if (camPaused[cam.id] || globalPaused) return;
        setDot(cell, 'offline');
        const errDiv = cell.querySelector('.cam-err');
        if (errDiv) errDiv.classList.add('show');
        if (cfg.reconnect !== false) {
          retryTimer = setTimeout(loadImg, (cfg.reconnectDelay || 5) * 1000);
        }
      };

      cell.innerHTML = `
        <div class="cam-vignette"></div>
        <div class="cam-id"><div class="dot loading"></div><span>CAM_${String(idx+1).padStart(2,'0')}</span></div>
        <div class="cam-rec">REC</div>
        <div class="cam-label">${cam.label || cam.id}</div>
        <div class="cam-toggle" title="Pause / Reprendre">⏸</div>
        <div class="cam-err">
          <div class="cam-err-icon">⬛</div>
          <div class="cam-err-msg">SIGNAL PERDU</div>
          <div class="cam-err-retry">↺ RECONNECTER</div>
        </div>
      `;
      cell.insertBefore(img, cell.firstChild);

      // Retry manuel
      cell.querySelector('.cam-err-retry').addEventListener('click', e => {
        e.stopPropagation();
        clearTimeout(retryTimer);
        loadImg();
      });

      // Clic = focus
      cell.addEventListener('click', e => {
        if (e.target.closest('.cam-toggle') || e.target.closest('.cam-err-retry')) return;
        toggleFocus(cam.id);
      });

      // Pause individuelle
      const toggleBtn = cell.querySelector('.cam-toggle');
      toggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        camPaused[cam.id] = !camPaused[cam.id];
        if (camPaused[cam.id]) {
          clearTimeout(retryTimer);
          img.src = '';
          setDot(cell, 'paused');
          toggleBtn.textContent = '▶';
        } else {
          toggleBtn.textContent = '⏸';
          loadImg();
        }
      });

      grid.appendChild(cell);
      loadImg();

    } else {
      // Mise à jour label
      const lbl = cell.querySelector('.cam-label');
      const idSpan = cell.querySelector('.cam-id span');
      if (lbl) lbl.textContent = cam.label || cam.id;
      if (idSpan) idSpan.textContent = `CAM_${String(idx+1).padStart(2,'0')}`;
    }

    const lbl = cell.querySelector('.cam-label');
    if (lbl) lbl.style.display = cfg.showLabels !== false ? '' : 'none';
  });

  document.getElementById('cam-badge').textContent = `${cfg.cameras.length} CAM`;
  applyLayout();
}

function setDot(cell, state) {
  const dot = cell.querySelector('.dot');
  if (dot) dot.className = `dot ${state}`;
}

// ── FOCUS ───────────────────────────────────────────────────
function toggleFocus(id) {
  const cells = [...document.querySelectorAll('.cam-cell')];
  if (focusedCam === id) {
    focusedCam = null;
    cells.forEach(c => { c.style.display=''; c.classList.remove('focused'); });
  } else {
    focusedCam = id;
    cells.forEach(c => {
      if (c.dataset.id === id) { c.classList.add('focused'); c.style.display=''; }
      else c.style.display = 'none';
    });
  }
  applyLayout();
}

// ── PAUSE GLOBAL ────────────────────────────────────────────
document.getElementById('btn-pause').addEventListener('click', () => {
  globalPaused = !globalPaused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = globalPaused ? '▶ REPRENDRE' : '⏸ PAUSE';
  btn.classList.toggle('on', globalPaused);
  cfg.cameras.forEach(cam => {
    const img = document.querySelector(`#cell-${cam.id} img`);
    if (!img) return;
    if (globalPaused) {
      img.src = '';
      setDot(document.getElementById(`cell-${cam.id}`), 'paused');
    } else if (!camPaused[cam.id]) {
      img.src = mjpegUrl(cam.id) + `&_t=${Date.now()}`;
      setDot(document.getElementById(`cell-${cam.id}`), 'loading');
    }
  });
});

// ── IDLE ────────────────────────────────────────────────────
let idleTimer = null;
function resetIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  if (cfg.idleMinutes > 0) {
    idleTimer = setTimeout(() => {
      cfg.cameras.forEach(c => {
        const img = document.querySelector(`#cell-${c.id} img`);
        if (img && !camPaused[c.id]) img.src = '';
      });
    }, cfg.idleMinutes * 60000);
  }
}
['mousemove','keydown','click'].forEach(e => document.addEventListener(e, resetIdle));

// ── VISIBILITÉ ──────────────────────────────────────────────
document.addEventListener('visibilitychange', () => {
  cfg.cameras.forEach(c => {
    const img = document.querySelector(`#cell-${c.id} img`);
    if (!img) return;
    if (document.hidden) img.src = '';
    else if (!camPaused[c.id] && !globalPaused) img.src = mjpegUrl(c.id) + `&_t=${Date.now()}`;
  });
});

// ── PANNEAU CONFIG ──────────────────────────────────────────
const panelEl = document.getElementById('panel');
const btnCfg  = document.getElementById('btn-cfg');

btnCfg.addEventListener('click', () => {
  const open = panelEl.classList.toggle('open');
  btnCfg.classList.toggle('on', open);
  if (open) renderPanel();
});
document.getElementById('ph-close').addEventListener('click', () => { panelEl.classList.remove('open'); btnCfg.classList.remove('on'); });

function renderPanel() {
  const list = document.getElementById('camlist');
  list.innerHTML = '';
  cfg.cameras.forEach((cam, i) => {
    const e = document.createElement('div'); e.className = 'ce';
    e.innerHTML = `
      <div class="cer">
        <input placeholder="ID stream go2rtc" value="${cam.id||''}" data-f="id" data-i="${i}">
        <input placeholder="Label" value="${cam.label||''}" data-f="label" data-i="${i}">
        <div class="ce-del" data-i="${i}">✕</div>
      </div>
      <div class="cer">
        <input placeholder="rtsp://user:pass@ip:554/stream" value="${cam.rtspUrl||''}" data-f="rtspUrl" data-i="${i}">
      </div>
    `;
    list.appendChild(e);
  });
  list.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { cfg.cameras[+inp.dataset.i][inp.dataset.f] = inp.value; }));
  list.querySelectorAll('.ce-del').forEach(btn => btn.addEventListener('click', () => { cfg.cameras.splice(+btn.dataset.i, 1); renderPanel(); renderGrid(); }));

  document.getElementById('s-server').value    = `http://localhost:${cfg.go2rtcPort||1984}`;
  document.getElementById('s-reconnect').checked = cfg.reconnect !== false;
  document.getElementById('s-delay').value      = cfg.reconnectDelay || 5;
  document.getElementById('s-clock').checked    = cfg.showClock !== false;
  document.getElementById('s-labels').checked   = cfg.showLabels !== false;
  document.getElementById('s-idle').value       = cfg.idleMinutes || 0;
  loadDisplays();
}

document.getElementById('btn-addcam').addEventListener('click', () => {
  cfg.cameras.push({ id:`cam${cfg.cameras.length+1}`, label:'', rtspUrl:'' });
  renderPanel();
});

async function loadDisplays() {
  const displays = await API.getDisplays();
  const el = document.getElementById('displayer'); el.innerHTML = '';
  displays.forEach(d => {
    const opt = document.createElement('div');
    opt.className = 'dopt' + (d.index === cfg.selectedDisplay ? ' active' : '');
    opt.innerHTML = `<span>${d.label}${d.primary?' ⭐':''}</span><span class="dbadge">${d.width}×${d.height}</span>`;
    opt.addEventListener('click', async () => {
      await API.setDisplay(d.index); cfg.selectedDisplay = d.index;
      [...el.children].forEach(c => c.classList.remove('active')); opt.classList.add('active');
    });
    el.appendChild(opt);
  });
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const sv = document.getElementById('s-server').value.replace(/\/+$/,'');
  cfg.go2rtcPort    = parseInt(sv.split(':').pop()) || 1984;
  cfg.reconnect     = document.getElementById('s-reconnect').checked;
  cfg.reconnectDelay= +document.getElementById('s-delay').value;
  cfg.showClock     = document.getElementById('s-clock').checked;
  cfg.showLabels    = document.getElementById('s-labels').checked;
  cfg.idleMinutes   = +document.getElementById('s-idle').value;

  await API.saveConfig(cfg);
  await API.go2rtcRestart(cfg);

  // Recharger tous les streams
  setTimeout(() => renderGrid(), 1500);
  resetIdle();

  document.getElementById('hud-clock').style.display = cfg.showClock ? '' : 'none';
  document.getElementById('hud-date').style.display  = cfg.showClock ? '' : 'none';

  const ok = document.getElementById('save-ok');
  ok.textContent = '✓ SAUVEGARDÉ';
  setTimeout(() => { ok.textContent = ''; }, 2500);
  panelEl.classList.remove('open'); btnCfg.classList.remove('on');
});

document.getElementById('btn-opendir').addEventListener('click', () => API.openConfigDir());
document.getElementById('btn-setup').addEventListener('click',   () => API.goToSetup());
document.getElementById('btn-quit').addEventListener('click',    () => { if(confirm('Quitter CamWall ?')) API.quit(); });

// ── CLAVIER ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (focusedCam) toggleFocus(focusedCam);
    else { panelEl.classList.remove('open'); btnCfg.classList.remove('on'); }
  }
  if ((e.key==='p'||e.key==='P') && !e.target.matches('input,select')) document.getElementById('btn-pause').click();
  if ((e.key==='s'||e.key==='S') && !e.target.matches('input,select')) btnCfg.click();
});

// ── INIT ────────────────────────────────────────────────────
async function init() {
  cfg = await API.getConfig();
  buildLP();
  startClock();
  renderGrid();
  resetIdle();

  const h = document.getElementById('hint');
  setTimeout(() => h.classList.add('show'),  800);
  setTimeout(() => h.classList.remove('show'), 7000);

  if (!cfg.showClock) {
    document.getElementById('hud-clock').style.display = 'none';
    document.getElementById('hud-date').style.display  = 'none';
  }
}

init().catch(console.error);
</script>
</body>
</html>
