<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamWall</title>
<style>
/* ── CSS VARIABLES & THEMES ───────────────────────────── */
:root {
  --bg:      #070a14; --surface: #0d1117; --panel:  #0f1520;
  --indigo:  #6366f1; --cyan:    #06b6d4; --purple: #a855f7;
  --green:   #10b981; --red:     #ef4444; --amber:  #f59e0b;
  --text:    #e2e8f0; --muted:   #94a3b8; --dim:    #475569;
  --border:  rgba(99,102,241,.15);
  --ui:      'Inter', system-ui, sans-serif;
  --mono:    'JetBrains Mono', 'Fira Code', monospace;
}
[data-theme="matrix"] {
  --bg:#001100; --surface:#001a00; --panel:#002200;
  --indigo:#00ff41; --cyan:#00cc33; --green:#00ff41;
  --text:#00ff41; --muted:#00aa22; --dim:#006600;
  --border:rgba(0,255,65,.12);
}
[data-theme="light"] {
  --bg:#f0f4f8; --surface:#fff; --panel:#f8fafc;
  --indigo:#4f46e5; --cyan:#0891b2;
  --text:#1e293b; --muted:#64748b; --dim:#94a3b8;
  --border:rgba(79,70,229,.15);
}

/* ── RESET ───────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--ui); user-select:none; }
body::before {
  content:''; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 80% 60% at 15% 25%, rgba(99,102,241,.07) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 85% 75%, rgba(6,182,212,.05) 0%, transparent 60%);
}

/* ── HUD ─────────────────────────────────────────────── */
#hud {
  position:fixed; top:0; left:0; right:0; height:44px; z-index:100;
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:rgba(7,10,20,.92); border-bottom:1px solid var(--border);
  backdrop-filter:blur(8px);
}
.hud-logo { font-size:13px; font-weight:700; letter-spacing:1px; color:var(--indigo); flex-shrink:0; }
.hud-version { font-size:9px; color:var(--dim); font-family:var(--mono); }
.hud-spacer  { flex:1; }
.btn-hud {
  height:28px; padding:0 10px; border:1px solid var(--border); border-radius:5px;
  background:rgba(99,102,241,.08); color:var(--muted); font-size:11px; cursor:pointer;
  display:flex; align-items:center; gap:5px; transition:all .15s; white-space:nowrap;
}
.btn-hud:hover { background:rgba(99,102,241,.2); color:var(--text); border-color:var(--indigo); }

/* ── GRILLE ──────────────────────────────────────────── */
#grid {
  position:fixed; top:44px; left:0; right:0; bottom:0;
  display:grid; background:var(--bg);
}
.cell {
  position:relative; overflow:hidden; background:var(--surface);
  border:1px solid rgba(255,255,255,.05); cursor:default;
}
.cell:hover { border-color:rgba(99,102,241,.2); }
.cell-label {
  position:absolute; top:6px; left:8px; z-index:10;
  font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--dim); pointer-events:none;
}
.cell-dot {
  position:absolute; top:6px; right:6px; z-index:10;
  width:6px; height:6px; border-radius:50%; background:var(--dim);
  transition:background .3s;
}
.cell-dot.ok   { background:var(--green); box-shadow:0 0 4px var(--green); }
.cell-dot.conn { background:var(--amber); animation:blink .8s infinite; }
.cell-dot.err  { background:var(--red); }
.cell-dot.off  { background:var(--dim); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── WIDGETS COMMUNS ─────────────────────────────────── */
.widget-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:8px; opacity:.4;
}
.widget-empty > div:first-child { font-size:28px; }
.widget-empty > div:last-child  { font-size:11px; }

/* ── CAMÉRA ──────────────────────────────────────────── */
.cam-overlay { position:absolute; inset:0; background:linear-gradient(0deg,rgba(7,10,20,.7) 0%,transparent 40%); pointer-events:none; }
.cam-err     { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(7,10,20,.85); }
.cam-err.show { display:flex; }
.cam-err-icon { font-size:28px; opacity:.6; }
.cam-err-msg  { font-size:11px; color:var(--muted); }
.cam-err-btn  { padding:6px 14px; background:rgba(99,102,241,.1); border:1px solid var(--indigo); border-radius:5px; color:var(--indigo); font-size:11px; cursor:pointer; }
.cam-snap, .cam-tog { position:absolute; z-index:20; width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center; background:rgba(7,10,20,.6); border:1px solid var(--border); cursor:pointer; font-size:12px; opacity:0; transition:opacity .2s; }
.cell:hover .cam-snap, .cell:hover .cam-tog { opacity:1; }
.cam-snap { bottom:8px; right:8px; }
.cam-tog  { bottom:8px; right:42px; }

/* ── HORLOGE ─────────────────────────────────────────── */
.clock-widget { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:4px; }
.clock-time   { font-size:clamp(28px,7vw,80px); font-weight:200; letter-spacing:2px; font-family:var(--mono); }
.clock-date   { font-size:clamp(10px,2vw,16px); color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.clock-week   { font-size:10px; color:var(--dim); letter-spacing:2px; }

/* ── SYSTÈME ─────────────────────────────────────────── */
.sys-widget  { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.si-header   { display:flex; align-items:center; gap:8px; flex-shrink:0; border-bottom:1px solid var(--border); padding-bottom:6px; }
.si-icon     { font-size:16px; }
.si-hostname { font-size:12px; font-weight:700; }
.si-platform { font-size:9px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
.si-row      { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.si-lbl      { font-size:9px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; width:36px; flex-shrink:0; }
.si-detail   { color:var(--dim); font-size:8px; margin-left:3px; text-transform:none; }
.si-bar      { flex:1; height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; }
.si-bar-fill { height:100%; border-radius:3px; transition:width .5s ease; }
.si-val      { font-size:10px; font-family:var(--mono); color:var(--muted); width:36px; text-align:right; flex-shrink:0; }
.si-network  { display:flex; flex-direction:column; gap:2px; }
.si-net-item { font-size:9px; color:var(--dim); display:flex; align-items:center; gap:4px; }
.si-net-icon { font-size:10px; }
.si-uptime   { font-size:8px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin-top:auto; }



/* ── MÉTÉO — design épuré ────────────────────────────── */
.wx { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:0; padding:12px; }

/* Partie centrale: icône + température + condition */
.wx-main { display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; gap:4px; }

.wx-icon { font-size:clamp(36px,6vw,72px); line-height:1;
  filter:drop-shadow(0 0 16px rgba(255,255,255,.12)); }

.wx-temp { font-size:clamp(42px,8vw,96px); font-weight:200;
  letter-spacing:-2px; line-height:1; color:var(--text); }
.wx-unit { font-size:.5em; font-weight:300; color:var(--muted);
  vertical-align:super; letter-spacing:0; }

.wx-cond  { font-size:clamp(11px,1.8vw,16px); color:var(--muted);
  text-transform:uppercase; letter-spacing:2px; margin-top:4px; }
.wx-feels { font-size:11px; color:var(--dim); margin-top:2px; }

/* Ligne de méta-infos */
.wx-row { display:flex; align-items:center; justify-content:center;
  gap:8px; flex-wrap:wrap; padding:8px 0;
  border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
  width:100%; }
.wx-pill { font-size:11px; color:var(--dim); white-space:nowrap; }

/* Prévisions — même style que les semaines dans l'horloge */
.wx-days { display:flex; width:100%; justify-content:space-around;
  padding-top:10px; }
.wx-day  { display:flex; flex-direction:column; align-items:center; gap:3px; }
.wx-day-name { font-size:9px; color:var(--dim); letter-spacing:2px;
  text-transform:uppercase; font-weight:600; }
.wx-day-icon { font-size:clamp(16px,3vw,28px); line-height:1; }
.wx-day-hi   { font-size:clamp(12px,2vw,18px); font-weight:600;
  font-family:var(--mono); color:var(--text); }
.wx-day-lo   { font-size:clamp(10px,1.6vw,14px); color:var(--dim);
  font-family:var(--mono); }

/* ── HOME ASSISTANT ──────────────────────────────────── */
.ha-widget      { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; gap:5px; overflow:hidden; }
.ha-entity      { display:flex; align-items:center; gap:8px; padding:5px 8px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05); border-radius:5px; flex-shrink:0; transition:background .15s; }
.ha-entity:hover { background:rgba(99,102,241,.08); }
.ha-entity-icon { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
.ha-entity-name { font-size:11px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ha-entity-state{ font-size:11px; font-family:var(--mono); flex-shrink:0; }

/* ── JELLYFIN ────────────────────────────────────────── */
.jf-widget      { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; }
.jf-playing     { position:relative; flex:1; overflow:hidden; }
.jf-poster      { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.4); }
.jf-overlay     { position:absolute; inset:0; background:linear-gradient(0deg,rgba(7,10,20,.95) 0%,transparent 60%); }
.jf-info        { position:absolute; bottom:0; left:0; right:0; padding:12px; }
.jf-title       { font-size:clamp(12px,2vw,18px); font-weight:700; }
.jf-subtitle    { font-size:10px; color:var(--muted); margin-top:3px; }
.jf-progress-bar{ height:3px; background:rgba(255,255,255,.1); border-radius:2px; margin-top:8px; overflow:hidden; }
.jf-progress-fill{height:100%; background:var(--indigo); border-radius:2px; transition:width .5s; }
.jf-user        { font-size:9px; color:var(--dim); margin-top:4px; }
.jf-idle        { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; opacity:.4; }
.jf-idle-icon   { font-size:32px; }
.jf-recent      { padding:8px; display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--border); }
.jf-recent-item { display:flex; align-items:center; gap:8px; font-size:10px; color:var(--muted); }
.jf-recent-thumb{ width:24px; height:14px; background:rgba(255,255,255,.1); border-radius:2px; flex-shrink:0; background-size:cover; background-position:center; }

/* ── IMMICH ──────────────────────────────────────────── */
.immich-widget   { position:absolute; inset:0; overflow:hidden; background:#000; }
.immich-img      { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity 1.5s ease; }
.immich-img.fade-out { opacity:0; }
.immich-overlay  { position:absolute; bottom:0; left:0; right:0; padding:10px 12px; background:linear-gradient(0deg,rgba(7,10,20,.85),transparent); opacity:0; transition:opacity .2s; }
.immich-widget:hover .immich-overlay { opacity:1; }
.immich-date     { font-size:10px; color:var(--muted); }
.immich-exif     { font-size:9px; color:rgba(255,255,255,.5); }

/* ── PI-HOLE ─────────────────────────────────────────── */
.pihole-widget   { position:absolute; inset:0; padding:14px; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
.ph-big          { display:flex; align-items:baseline; gap:8px; }
.ph-num          { font-size:clamp(20px,4vw,40px); font-weight:700; font-family:var(--mono); color:var(--red); }
.ph-pct          { font-size:clamp(13px,2vw,22px); color:var(--muted); font-family:var(--mono); }
.ph-bar          { height:8px; background:rgba(255,255,255,.06); border-radius:4px; overflow:hidden; }
.ph-bar-fill     { height:100%; background:linear-gradient(90deg,var(--red),var(--amber)); border-radius:4px; transition:width .5s; }
.ph-stats-grid   { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.ph-stat         { background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:4px; padding:5px 8px; }
.ph-stat-v       { font-size:14px; font-weight:700; font-family:var(--mono); }
.ph-stat-l       { font-size:8px; color:var(--dim); letter-spacing:1px; }

/* ── MOONRAKER ───────────────────────────────────────── */
.moon-widget     { position:absolute; inset:0; padding:14px; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
.moon-status     { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:12px; font-size:10px; letter-spacing:1px; font-weight:600; text-transform:uppercase; flex-shrink:0; }
.moon-printing   { background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.3); color:var(--green); }
.moon-idle       { background:rgba(71,85,105,.15); border:1px solid rgba(71,85,105,.3); color:var(--dim); }
.moon-error      { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3); color:var(--red); }
.moon-temps      { display:flex; gap:8px; flex-shrink:0; }
.moon-temp       { flex:1; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:5px; padding:6px 8px; }
.moon-temp-val   { font-size:18px; font-weight:700; font-family:var(--mono); color:var(--amber); }
.moon-temp-lbl   { font-size:8px; color:var(--dim); letter-spacing:1px; }
.moon-progress   { flex-shrink:0; }
.moon-pct        { font-size:clamp(20px,4vw,36px); font-weight:300; font-family:var(--mono); color:var(--indigo); }
.moon-bar        { height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; margin-top:6px; }
.moon-bar-fill   { height:100%; background:linear-gradient(90deg,var(--indigo),var(--cyan)); border-radius:3px; transition:width .5s; }
.moon-file       { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.moon-eta        { font-size:9px; color:var(--dim); font-family:var(--mono); }

/* ── SPEEDTEST ───────────────────────────────────────── */
.speed-widget    { position:absolute; inset:0; padding:14px; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
.speed-gauges    { display:flex; gap:8px; flex:1; }
.speed-gauge     { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:8px; padding:10px; }
.speed-val       { font-size:clamp(16px,3vw,30px); font-weight:700; font-family:var(--mono); }
.speed-unit      { font-size:9px; color:var(--dim); letter-spacing:1px; margin-top:2px; }
.speed-lbl       { font-size:8px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:6px; }
.speed-dl        { color:var(--cyan); }
.speed-ul        { color:var(--indigo); }
.speed-ping-val  { font-size:clamp(14px,2.5vw,26px); font-weight:700; font-family:var(--mono); color:var(--green); }
.speed-run-btn   { padding:8px; background:rgba(99,102,241,.08); border:1px solid rgba(99,102,241,.2); border-radius:6px; color:var(--indigo); font-size:11px; cursor:pointer; text-align:center; flex-shrink:0; transition:all .2s; }
.speed-run-btn:hover { background:rgba(99,102,241,.2); }
.speed-running   { opacity:.6; cursor:not-allowed; animation:blink .8s infinite; }

/* ── KUMA ────────────────────────────────────────────── */
.kuma-widget     { position:absolute; inset:0; padding:10px; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
.kuma-header     { display:flex; align-items:center; gap:8px; flex-shrink:0; border-bottom:1px solid var(--border); padding-bottom:6px; }
.kuma-icon       { font-size:14px; }
.kuma-title      { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
.kuma-list       { display:flex; flex-direction:column; gap:3px; overflow:hidden; }
.kuma-item       { display:flex; align-items:center; gap:6px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.03); }
.kuma-dot        { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.kuma-dot.up     { background:var(--green); }
.kuma-dot.down   { background:var(--red); }
.kuma-name       { font-size:10px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kuma-ping       { font-size:9px; color:var(--dim); font-family:var(--mono); }
.kuma-uptime     { font-size:9px; color:var(--muted); font-family:var(--mono); }
.kuma-badge      { padding:1px 5px; border-radius:3px; font-size:8px; font-weight:700; letter-spacing:1px; flex-shrink:0; }
.kuma-badge.up   { background:rgba(16,185,129,.15); color:var(--green); border:1px solid rgba(16,185,129,.3); }
.kuma-badge.down { background:rgba(239,68,68,.15); color:var(--red); border:1px solid rgba(239,68,68,.3); }

/* ── BESZEL ──────────────────────────────────────────── */
.bsz-widget  { position:absolute; inset:0; padding:10px; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
.bsz-header  { display:flex; align-items:center; gap:8px; flex-shrink:0; border-bottom:1px solid var(--border); padding-bottom:6px; font-size:10px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
.bsz-item    { padding:5px 8px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:5px; flex-shrink:0; }
.bsz-name    { font-size:11px; font-weight:700; }
.bsz-stats   { display:flex; gap:10px; font-size:9px; color:var(--muted); font-family:var(--mono); margin-top:3px; }

/* ── PROXMOX ─────────────────────────────────────────── */
.px-widget   { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.px-header   { display:flex; align-items:center; gap:8px; flex-shrink:0; border-bottom:1px solid var(--border); padding-bottom:6px; }
.px-title    { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); flex:1; }
.px-ts       { font-size:9px; color:var(--dim); font-family:var(--mono); }
.px-section  { flex-shrink:0; }
.px-info     { display:flex; gap:12px; font-size:10px; color:var(--muted); font-family:var(--mono); padding:4px 0; }
.px-vm       { display:flex; align-items:center; gap:6px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.03); }
.px-vm-dot   { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.px-vm-dot.up{ background:var(--green); }
.px-vm-dot.down { background:var(--red); }
.px-vm-name  { font-size:10px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.px-vm-type  { font-size:8px; color:var(--dim); padding:1px 4px; border:1px solid var(--border); border-radius:2px; }
.px-vm-status{ font-size:9px; font-family:var(--mono); }
.px-vm-status.up   { color:var(--green); }
.px-vm-status.down { color:var(--red); }
.px-vm-cpu   { font-size:9px; color:var(--dim); font-family:var(--mono); }

/* ── PANNEAU PARAMÈTRES ──────────────────────────────── */
#panel {
  position:fixed; top:0; right:0; bottom:0; width:440px; z-index:200;
  background:var(--panel); border-left:1px solid var(--border);
  transform:translateX(100%); transition:transform .25s ease;
  display:flex; flex-direction:column; overflow:hidden;
}
#panel.open { transform:translateX(0); }
.panel-hdr  { display:flex; align-items:center; height:44px; padding:0 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.panel-title{ font-size:13px; font-weight:700; flex:1; }
.panel-close{ width:28px; height:28px; border-radius:5px; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:var(--red); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; }
.panel-tabs { display:flex; gap:2px; padding:8px 12px; border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto; }
.tab-btn    { padding:5px 10px; border-radius:5px; font-size:10px; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; border:1px solid transparent; color:var(--dim); background:none; white-space:nowrap; }
.tab-btn:hover, .tab-btn.active { background:rgba(99,102,241,.12); border-color:var(--indigo); color:var(--indigo); }
#panel-body { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; }

/* ── COMPOSANTS PANEL ────────────────────────────────── */
.ps     { background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:8px; padding:12px; }
.ps-t   { font-size:10px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.cc-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.04); }
.cc-row:last-child { border-bottom:none; }
.cc-lbl { font-size:11px; color:var(--muted); min-width:100px; flex-shrink:0; }
.pi-in  { background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:5px; color:var(--text); font-size:11px; padding:5px 8px; outline:none; }
.pi-in:focus  { border-color:var(--indigo); }
.pi-sm  { width:60px; }
.pi-sel { background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:5px; color:var(--text); font-size:11px; padding:5px 8px; outline:none; }
textarea.pi-in { resize:vertical; }
.btn-prim { width:100%; padding:9px; background:var(--indigo); border:none; border-radius:6px; color:#fff; font-size:12px; font-weight:600; cursor:pointer; margin-top:8px; transition:all .15s; }
.btn-prim:hover { background:#4f46e5; }
.btn-ghost { padding:6px 12px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:5px; color:var(--muted); font-size:11px; cursor:pointer; transition:all .15s; }
.btn-ghost:hover { border-color:var(--indigo); color:var(--indigo); }

/* ── GRILLE PREVIEW ──────────────────────────────────── */
.grid-preview { display:grid; gap:4px; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr)); }
.gp-cell { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:5px; padding:8px; text-align:center; cursor:pointer; transition:all .15s; }
.gp-cell:hover { border-color:var(--indigo); background:rgba(99,102,241,.08); }
.gp-icon { font-size:18px; margin-bottom:4px; }
.gp-type { font-size:9px; color:var(--dim); letter-spacing:.5px; text-transform:uppercase; }

/* ── CAM ITEM PANEL ──────────────────────────────────── */
.cam-item        { padding:8px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:5px; margin-bottom:6px; }
.cam-item-name   { font-size:12px; font-weight:700; }
.cam-item-url    { font-size:9px; color:var(--dim); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:3px 0; }
.cam-item-actions{ display:flex; gap:6px; margin-top:6px; }

/* ── MODE NUIT ───────────────────────────────────────── */
.night-mode { filter:brightness(.65) saturate(.8); } /* mode nuit */
.night-mode #hud { filter:brightness(1) saturate(1) !important; }
.night-mode #panel { filter:brightness(1) saturate(1) !important; }
#night-banner { display:none; position:fixed; top:52px; left:50%; transform:translateX(-50%); background:rgba(7,10,20,.9); border:1px solid rgba(245,158,11,.3); border-radius:6px; padding:5px 14px; font-size:10px; color:var(--amber); letter-spacing:1px; z-index:300; }
#night-banner.show { display:block; }

/* ── NOTIFICATIONS ───────────────────────────────────── */
#update-banner { display:none; position:fixed; top:52px; right:12px; background:rgba(7,10,20,.95); border:1px solid var(--indigo); border-radius:6px; padding:6px 14px; font-size:11px; color:var(--indigo); cursor:pointer; z-index:300; }

/* ── DRAG & DROP ─────────────────────────────────────── */
.cell[draggable="true"] { cursor: grab; }
.cell[draggable="true"]:active { cursor: grabbing; }

/* Case en cours de drag: semi-transparente */
.cell-dragging {
  opacity: .35;
  outline: 2px dashed var(--indigo);
  outline-offset: -2px;
}

/* Case cible: highlight de drop */
.cell-dragover {
  outline: 2px solid var(--indigo) !important;
  outline-offset: -2px;
  background: rgba(99,102,241,.12) !important;
}
.drag-capture-overlay { position:absolute;inset:0;z-index:99; }
.cell-dragover::after {
  content: '↕ Déposer ici';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--indigo);
  letter-spacing: 1px;
  background: rgba(99,102,241,.08);
  z-index: 50;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="hud-logo">CAMWALL</div>
  <div class="hud-version" id="hud-version"></div>
  <div class="hud-spacer"></div>
  <button class="btn-hud" id="btn-refresh" title="Rafraîchir">↺</button>
  <button class="btn-hud" id="btn-night" title="Mode nuit ON/OFF">🌙</button>
  <button class="btn-hud" id="btn-settings" title="Paramètres">⚙ Paramètres</button>
</div>

<!-- GRILLE -->
<div id="grid"></div>

<!-- PANNEAU PARAMÈTRES -->
<div id="panel">
  <div class="panel-hdr">
    <div class="panel-title">Paramètres</div>
    <button class="panel-close" id="panel-close">×</button>
  </div>
  <div class="panel-tabs">
    <button class="tab-btn active" data-tab="grid">🔲 Grille</button>
    <button class="tab-btn" data-tab="cams">📷 Cams</button>
    <button class="tab-btn" data-tab="proxmox">🖥 Proxmox</button>
    <button class="tab-btn" data-tab="options">⚙ Options</button>
    <button class="tab-btn" data-tab="system">ℹ Système</button>
  </div>
  <div id="panel-body"></div>
</div>

<!-- BANNERS -->
<div id="night-banner">🌙 MODE NUIT</div>
<div id="update-banner"></div>

<!-- Snake Easter egg -->
<div id="snake-overlay" style="display:none;position:fixed;inset:0;z-index:999;align-items:center;justify-content:center;background:rgba(0,0,0,.92)">
  <div id="snake-score" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:14px;color:#00ff41;letter-spacing:2px;font-family:monospace">SCORE: 0</div>
  <div id="snake-close" style="position:absolute;top:14px;right:14px;width:32px;height:32px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#ef4444;font-size:18px">×</div>
  <canvas id="snake-canvas" width="400" height="400" style="border:2px solid #6366f1;border-radius:4px"></canvas>
</div>

<!-- APP JS (ES Module) -->
<script type="module" src="./app.js"></script>

<!-- Easter egg snake: triple-clic logo -->
<script>
(function() {
  var clicks = 0, ct;
  document.querySelector('.hud-logo')?.addEventListener('click', function() {
    clicks++; clearTimeout(ct);
    ct = setTimeout(function() { clicks = 0; }, 700);
    if (clicks >= 3) { clicks = 0; launchSnake(); }
  });
  function launchSnake() {
    var ov=document.getElementById('snake-overlay'), cv=document.getElementById('snake-canvas'), sc=document.getElementById('snake-score');
    if (!ov||!cv) return; ov.style.display='flex';
    var ctx=cv.getContext('2d'),C=20,N=20,snake,dir,food,score,over,loop;
    function rf(){return{x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}
    function draw(){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,400,400);ctx.fillStyle='#ff2d55';ctx.fillRect(food.x*C+2,food.y*C+2,C-4,C-4);snake.forEach(function(s,i){ctx.fillStyle=i?'#00bb30':'#00ff41';ctx.fillRect(s.x*C+1,s.y*C+1,C-2,C-2);});if(sc)sc.textContent='SCORE: '+score;if(over){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,400,400);ctx.fillStyle='#00ff41';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',200,190);ctx.font='13px monospace';ctx.fillText('Score: '+score,200,218);ctx.fillText('Cliquer pour rejouer',200,242);}}
    function step(){var h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};if(snake.some(function(s){return s.x===h.x&&s.y===h.y;})){over=true;clearInterval(loop);draw();return;}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food=rf();}else snake.pop();draw();}
    function start(){snake=[{x:10,y:10}];dir={x:1,y:0};food=rf();score=0;over=false;clearInterval(loop);loop=setInterval(step,120);}
    start();draw();cv.onclick=function(){if(over)start();};
    document.getElementById('snake-close').onclick=function(){clearInterval(loop);ov.style.display='none';};
    document.addEventListener('keydown',function kh(e){var m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(m[e.key]){e.preventDefault();var nd=m[e.key];if(nd.x!==-dir.x||nd.y!==-dir.y)dir=nd;}if(e.key==='Escape'){clearInterval(loop);ov.style.display='none';document.removeEventListener('keydown',kh);}},{capture:true});
  }
})();
</script>
</body>
</html>
