<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<style>*{margin:0;padding:0;box-sizing:border-box;}html,body{width:100vw;height:100vh;background:#070a14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#94a3b8;}
.logo{font-size:32px;font-weight:200;letter-spacing:8px;color:#6366f1;margin-bottom:20px;}
.spinner{width:32px;height:32px;border:2px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
.msg{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.5;}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="logo">CAMWALL</div>
<div class="spinner"></div>
<div class="msg">Démarrage en cours...</div>
</body></html>
