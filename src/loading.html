<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CamWall</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw; height: 100vh;
  background: #030508;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  color: #00e87a; user-select: none; overflow: hidden;
}
.logo {
  font-size: 22px; letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(0,232,122,0.3);
  margin-bottom: 32px;
}
.bar-wrap {
  width: 220px; height: 2px;
  background: rgba(0,200,100,0.1);
  border-radius: 1px; overflow: hidden;
}
.bar {
  height: 100%; width: 0%;
  background: #00e87a;
  box-shadow: 0 0 8px #00e87a;
  animation: load 2s ease-in-out infinite;
}
@keyframes load {
  0%   { width: 0%; margin-left: 0; }
  50%  { width: 80%; margin-left: 0; }
  100% { width: 0%; margin-left: 100%; }
}
.msg { margin-top: 20px; font-size: 10px; letter-spacing: 2px; color: #007a45; }
</style>
</head>
<body>
<div class="logo">CAMWALL</div>
<div class="bar-wrap"><div class="bar"></div></div>
<div class="msg">DÉMARRAGE DU BACKEND...</div>
</body>
</html>
