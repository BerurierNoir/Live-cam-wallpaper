name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download go2rtc
        run: bash scripts/download-go2rtc.sh amd64

      - name: Install ImageMagick (pour génération icône)
        run: sudo apt-get install -y imagemagick

      - name: Generate PNG icon from SVG
        run: node scripts/generate-icon.js

      - name: Build AppImage & deb
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CamWall-AppImage
          path: dist/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CamWall-deb
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.1.0
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
