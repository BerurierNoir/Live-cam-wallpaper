name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download go2rtc amd64
        run: bash scripts/download-go2rtc.sh amd64

      - name: Build AppImage + deb + rpm
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWall-AppImage
          path: dist/*.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWall-deb
          path: dist/*.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWall-rpm
          path: dist/*.rpm

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.1.0
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
          body: |
            ## Installation

            ### AppImage (recommandé — toutes distributions)
            ```bash
            chmod +x CamWall-*.AppImage
            ./CamWall-*.AppImage
            ```

            ### Fedora / Bazzite (RPM)
            ```bash
            sudo rpm -i CamWall-*.rpm
            ```

            ### Debian / Ubuntu
            ```bash
            sudo dpkg -i CamWall-*.deb
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
