appId: io.github.camwall
productName: CamWall
copyright: "Copyright © 2025 — MIT License"

directories:
  output: dist
  buildResources: assets

files:
  - main.js
  - preload.js
  - src/**
  - node_modules/**
  - package.json

extraResources:
  - from: bin/
    to: bin/
    filter:
      - go2rtc

linux:
  target:
    - type: AppImage
      arch: x64
    - type: deb
      arch: x64
  category: Utility
  icon: assets/icon.png
  synopsis: "Live camera wallpaper — stream RTSP cameras directly on your desktop"
  description: |
    CamWall turns any screen into a live surveillance display.
    Supports multiple RTSP cameras via go2rtc, with a minimal
    hover-triggered HUD and full configuration UI.
  maintainer: "Your Name <your@email.com>"
  desktop:
    Name: CamWall
    Comment: Live camera wallpaper
    Categories: Utility;Video;

appImage:
  license: LICENSE

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
