appId: io.github.camwall
productName: CamWall
copyright: "MIT License"

directories:
  output: dist
  buildResources: assets

files:
  - main.js
  - preload.js
  - src/**
  - node_modules/**
  - package.json

extraResources:
  - from: bin/
    to: bin/
    filter:
      - go2rtc

linux:
  target:
    - type: AppImage
    - type: deb
    - type: rpm
  icon: assets/icon.png
  category: Utility
  synopsis: "Live camera wallpaper — RTSP, Reolink, Tapo, ONVIF"
  description: |
    CamWall transforms any monitor into a live surveillance display.
    Supports RTSP, Reolink, Tapo, ONVIF cameras via go2rtc.
    Widgets: cameras, system metrics, Proxmox, Uptime Kuma, Beszel, clock.
  desktop:
    Name: CamWall
    Comment: Live camera wallpaper — RTSP, Reolink, Proxmox, Kuma
    Categories: Utility;Video;Monitor;
    Keywords: camera;surveillance;rtsp;wallpaper;reolink;proxmox;

appImage:
  license: LICENSE

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - xdg-utils
    - libsecret
