appId: io.github.camwall
productName: CamWall
copyright: "Copyright © 2025 — MIT License"

directories:
  output: dist
  buildResources: assets

files:
  - main.js
  - preload.js
  - src/**
  - node_modules/**
  - package.json

extraResources:
  - from: bin/
    to: bin/
    filter:
      - go2rtc

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: assets/icon.png
  synopsis: "Live camera wallpaper for Linux"
  description: "Stream RTSP cameras directly on your desktop with a minimal HUD"
  maintainer: "Your Name <your@email.com>"
  desktop:
    Name: CamWall
    Comment: Live camera wallpaper
    Categories: Utility;Video;

appImage:
  license: LICENSE
